[graph]
# Audit the complete private workspace, including examples and tools.
exclude-unpublished = false
# Dev dependencies are not relevant to the published library crates, so we ignore them.
exclude-dev = true

[bans]
multiple-versions = "deny"
skip-tree = [{ name = "rustc-hash", version = "1.1.0" }]
skip = [
    # naga -> petgraph uses an old version
    { name = "hashbrown", version = "0.15.5" },
    # Used by hashbrown 0.15.5
    { name = "foldhash", version = "0.1.5" },

    # naga depends on hashbrown 0.16 directly, while naga -> indexmap pulls hashbrown 0.17
    { name = "hashbrown", version = "0.16.1" },

    # etalon-hal -> drm -> drm-sys uses an older version, while etalon-hal -> drm -> rustix uses a newer one
    { name = "linux-raw-sys", version = "0.9.4" },

    # Derive macros use both syn 2 and syn 3.
    { name = "syn", version = "3" },

    # Winit 0.30 and its platform backends require these older, incompatible APIs.
    { name = "bitflags", version = "=1.3.2" },
    { name = "block2", version = "=0.5.1" },
    { name = "objc2", version = "=0.5.2" },
    { name = "objc2-foundation", version = "=0.2.2" },
    { name = "getrandom", version = "=0.3.4" },
    { name = "r-efi", version = "=5.3.0" },
    { name = "rustix", version = "=0.38.44" },
    { name = "linux-raw-sys", version = "=0.4.15" },
    { name = "thiserror", version = "=1.0.69" },
    { name = "thiserror-impl", version = "=1.0.69" },
    { name = "redox_syscall", version = "=0.4.1" },
    { name = "redox_syscall", version = "=0.5.18" },
    { name = "windows-sys", version = "=0.52.0" },
    { name = "windows-sys", version = "=0.59.0" },
    { name = "windows-targets", version = "=0.52.6" },
    { name = "windows_aarch64_gnullvm", version = "=0.52.6" },
    { name = "windows_aarch64_msvc", version = "=0.52.6" },
    { name = "windows_i686_gnu", version = "=0.52.6" },
    { name = "windows_i686_gnullvm", version = "=0.52.6" },
    { name = "windows_i686_msvc", version = "=0.52.6" },
    { name = "windows_x86_64_gnu", version = "=0.52.6" },
    { name = "windows_x86_64_gnullvm", version = "=0.52.6" },
    { name = "windows_x86_64_msvc", version = "=0.52.6" },

    # Parking-lot deadlock detection uses petgraph 0.6 and its fixedbitset API.
    { name = "petgraph", version = "=0.6.5" },
    { name = "fixedbitset", version = "=0.4.2" },
    # Backtrace and PNG compression have incompatible miniz_oxide requirements.
    { name = "miniz_oxide", version = "=0.8.9" },
    # JNI 0.3 is required by NDK 0.9, alongside the JNI 0.4 implementation.
    { name = "jni-sys", version = "=0.3.1" },
]
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
ignore = [
    # `bincode` is no longer maintained https://rustsec.org/advisories/RUSTSEC-2025-0141
    # We only use it directly for tests and tools.
    "RUSTSEC-2025-0141",
    # Winit 0.30's Wayland title renderer requires ab_glyph/ttf-parser.
    # No compatible maintained parser exists in that upstream dependency chain.
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"

[sources.allow-org]
github = []
