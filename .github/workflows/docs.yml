name: Docs

on:
  push:
    branches: [dev, trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_MSRV: "1.96.1"
  CARGO_INCREMENTAL: false
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install documentation toolchain
        run: rustup toolchain install ${{ env.REPO_MSRV }} --no-self-update --profile=minimal --target wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: public-docs
          env-vars: ImageVersion
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: Validate site assembler
        run: python3 -m unittest discover -s docs/site -p "test_*.py"

      - name: Read exact wasm-bindgen version from Cargo.lock
        id: bindgen-version
        shell: bash
        run: |
          python3 - <<'PYVERSION' >> "$GITHUB_OUTPUT"
          import pathlib, re, tomllib
          lock = tomllib.loads(pathlib.Path("Cargo.lock").read_text())
          versions = {p["version"] for p in lock["package"] if p["name"] == "wasm-bindgen"}
          if len(versions) != 1 or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", next(iter(versions))):
              raise SystemExit("Cargo.lock must pin exactly one wasm-bindgen release")
          print("version=" + versions.pop())
          PYVERSION

      - name: Install matching wasm-bindgen CLI
        run: cargo +${{ env.REPO_MSRV }} install wasm-bindgen-cli --locked --version "${{ steps.bindgen-version.outputs.version }}"

      - name: Build first-party browser library tests
        shell: bash
        env:
          ETALON_DEMO_REVISION: ${{ github.sha }}
        run: |
          cargo +${{ env.REPO_MSRV }} build --locked -p etalon-browser-demo --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --no-typescript \
            --out-dir "${{ runner.temp }}/etalon-browser-assets" --out-name etalon_browser_demo \
            target/wasm32-unknown-unknown/release/etalon_browser_demo.wasm

      - name: Build public library documentation
        run: |
          cargo +${{ env.REPO_MSRV }} doc --locked --no-deps --lib \
            -p etalon -p etalon-wgsl-forge -p etalon-nquin -p etalon-tensor \
            -p etalon-render -p etalon-wasm -p etalon-agent \
            -p etalon-sense -p etalon-sense-core \
            -p etalon-sense-runtime -p etalon-signal -p etalon-sense-cpu \
            -p etalon-sense-sdr -p etalon-sense-host -p etalon-sense-nfc \
            -p etalon-sense-camera -p etalon-sense-gpu \
            --features etalon-sense/cpu,etalon-sense/sdr,etalon-sense/host,etalon-sense/nfc,etalon-sense/camera,etalon-sense/gpu-vulkan

      - name: Assemble and validate site
        run: |
          python3 docs/site/build.py --rustdoc target/doc \
            --browser-assets "${{ runner.temp }}/etalon-browser-assets" \
            --output "${{ runner.temp }}/etalon-pages" --revision "$GITHUB_SHA"

      - name: Install locked browser test controller
        run: npm ci --prefix tests/wasm/runner --ignore-scripts --no-audit --no-fund

      - name: Execute assembled Rust/WASM tests with actual WebGPU
        run: python3 docs/site/smoke_browser.py --site "${{ runner.temp }}/etalon-pages"

      - name: Retain failed browser build for local reproduction
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-reproduction-${{ github.sha }}
          path: ${{ runner.temp }}/etalon-browser-assets
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/etalon-pages

  deploy:
    name: Deploy development documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
