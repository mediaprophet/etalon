[package]
name = "etalon-example-custom-backend"
edition = "2024"
rust-version = "1.87"
publish = false

[lints]

[features]
default = ["web"]
web = ["etalon/web"]

[dependencies]
etalon = { version = "0.0.1", features = [
    "custom",
    "wgsl",
], default-features = false }
pollster = { version = "1.0", features = ["macro"] }
