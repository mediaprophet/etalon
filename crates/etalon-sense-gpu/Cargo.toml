[package]
name = "etalon-sense-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Explicit Etalon GPU execution for bounded sensing operations"

[features]
default = []
vulkan = ["etalon/vulkan"]
dx12 = ["etalon/dx12"]
metal = ["etalon/metal"]
gles = ["etalon/gles"]
webgpu = ["etalon/webgpu"]

[dependencies]
etalon = { path = "../../etalon", default-features = false, features = ["std", "wgsl"] }
etalon-signal = { path = "../etalon-signal" }
etalon-sense-core = { path = "../etalon-sense-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
etalon = { path = "../../etalon", default-features = false, features = ["std", "wgsl", "webgpu"] }
wasm-bindgen = { workspace = true, features = ["std"] }
js-sys = { workspace = true, features = ["std"] }

[dev-dependencies]
naga = { workspace = true, features = ["wgsl-in"] }
pollster.workspace = true
