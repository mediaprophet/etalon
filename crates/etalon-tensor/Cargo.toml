[package]
name = "etalon-tensor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "Prepared tensor execution, unified forward arena, and fused attention for Etalon"

[features]
default = ["std"]
std = []
cuda = ["dep:etalon-agent"]

[dependencies]
etalon = { workspace = true }
etalon-types = { workspace = true }
bytemuck = { workspace = true }
hashbrown = { workspace = true }
log = { workspace = true }
thiserror = "2.0.21"
etalon-agent = { workspace = true, optional = true }

[dev-dependencies]
naga = { workspace = true, features = ["wgsl-in"] }
