[package]
name = "etalon-tensor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "Prepared tensor execution, unified forward arena, and fused attention for Etalon"

[features]
default = ["std"]
std = []
cuda = ["dep:etalon-agent", "dep:etalon-cuda", "dep:etalon-wgsl-forge"]

[dependencies]
etalon = { workspace = true }
etalon-types = { workspace = true }
bytemuck = { workspace = true }
hashbrown = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = "2.0.21"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
etalon-cuda = { workspace = true, optional = true }
etalon-wgsl-forge = { workspace = true, optional = true, features = ["cuda"] }
etalon-agent = { workspace = true, optional = true }

[dev-dependencies]
naga = { workspace = true, features = ["wgsl-in"] }
