[package]
name = "etalon-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "Decoupled volumetric, HUD, and EMF rendering substrate for Etalon"

[features]
default = ["std", "gpu"]
std = []
gpu = ["dep:etalon", "dep:etalon-types", "dep:etalon-wasm"]

[dependencies]
etalon = { workspace = true, optional = true }
etalon-types = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }
thiserror = "2.0.21"

etalon-wasm = { path = "../etalon-wasm", features = ["gpu-readback"], optional = true }

