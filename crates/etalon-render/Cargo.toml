[package]
name = "etalon-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "Decoupled volumetric, HUD, and EMF rendering substrate for Etalon"

[features]
default = ["std", "gpu"]
std = []
gpu = ["dep:etalon", "dep:etalon-types", "dep:etalon-wasm"]

[dependencies]
etalon = { workspace = true, optional = true }
etalon-types = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }
naga = { workspace = true, features = ["wgsl-in", "glsl-out", "spv-out"] }
serde = { workspace = true, features = ["derive", "std"] }
thiserror = "2.0.21"

etalon-wasm = { path = "../etalon-wasm", features = ["gpu-readback"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = "0.13"
flate2 = "1.1.9"
