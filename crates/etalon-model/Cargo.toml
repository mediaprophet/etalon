[package]
name = "etalon-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "Borrowed model container layouts and explicit integrity validation"

[features]
default = []
# Preserves the original codec float operations; requires std on native and WASM.
ggml = ["dep:half", "dep:bytemuck"]

[dependencies]
half = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true, features = ["derive"] }

[lints]
workspace = true
