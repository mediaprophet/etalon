[package]
name = "etalon-browser-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Bounded Etalon WebGPU browser demonstration and self-tests"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
etalon = { path = "../../etalon", default-features = false, features = ["std", "wgsl", "webgpu"] }
wasm-bindgen = { workspace = true, features = ["std"] }
wasm-bindgen-futures = { workspace = true, features = ["std"] }
js-sys = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
etalon-nquin = { path = "../etalon-nquin", default-features = false, features = ["std"] }
etalon-wgsl-forge = { path = "../etalon-wgsl-forge", default-features = false, features = [
    "std",
    "wgsl",
    "naga-validate"
] }

[dev-dependencies]
etalon-types = { workspace = true }
