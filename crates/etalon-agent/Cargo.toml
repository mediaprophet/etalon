[package]
name = "etalon-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "Silicon steward, capability state machine, and safe resource lease manager for Etalon"

[features]
default = ["std"]
std = []
cuda = []

[dependencies]
etalon = { workspace = true }
etalon-types = { workspace = true }
etalon-hal = { workspace = true, optional = true }
log = { workspace = true }
bytemuck = { workspace = true }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_DXCore",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tempfile.workspace = true
