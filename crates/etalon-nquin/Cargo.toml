[package]
name = "etalon-nquin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "48-byte semantic datum, warp-scan sieve, and stable GPU LSD radix sort for Etalon"

[features]
default = ["std", "gpu"]
std = []
gpu = ["dep:etalon"]

[dependencies]
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }
thiserror = "2.0.21"
etalon = { workspace = true, optional = true }

[dev-dependencies]
naga = { workspace = true, features = ["wgsl-in"] }
