[workspace]
resolver = "3"
members = [
    "etalon-sense-npu",
    "etalon-sense-qnn",
    "etalon-sense-deployment",
    "etalon-sense-dsp",
    "etalon-sense-dsp-hexagon",
    "etalon-sense-dsp-wire",
    "etalon-sense-dsp-service",
    "etalon-sense-fastrpc",
    "etalon-sense-rtlsdr",
]

[workspace.package]
version = "0.0.2"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
rust-version = "1.99"
license = "CC-BY-NC-ND-4.0"
publish = false

[workspace.lints.clippy]
chunks_exact_to_as_chunks = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
useless_borrows_in_formatting = "allow"
result_large_err = "allow"
missing_transmute_annotations = "allow"
unnecessary_map_or = "allow"
io_other_error = "allow"
single_match = "allow"
needless_range_loop = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
manual_range_contains = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
field_reassign_with_default = "allow"
derivable_impls = "allow"
ptr_arg = "allow"
redundant_closure = "allow"
unwrap_or_default = "allow"
needless_borrow = "allow"
needless_return = "allow"
len_zero = "allow"
comparison_chain = "allow"
new_without_default = "allow"
should_implement_trait = "allow"
enum_variant_names = "allow"
large_enum_variant = "allow"
doc_lazy_continuation = "allow"
empty_line_after_doc_comments = "allow"
