# NOTE: Other global Clippy config (severity overrides) is in top-level Cargo.toml.

disallowed-types = [
    { path = "std::collections::HashMap", reason = "use hashbrown::HashMap instead" },
    { path = "std::collections::HashSet", reason = "use hashbrown::HashSet instead" },
]

# This relatively small stack frame limit is set to avoid problems in several deeply
# recursive functions in naga. If your function has a genuine need for a larger stack frame,
# and is not at risk of deep recursion based on shader structure, it is okay to waive the
# associated `clippy::large_stack_frames` lint.
# The 40_960 stack-size threshold is intentionally set to protect against deep recursion
# in Naga shader translation passes while admitting legitimate bounded stack frames.
stack-size-threshold = 40_960
