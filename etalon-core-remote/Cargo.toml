[package]
name = "etalon-core-remote"
version.workspace = true
edition.workspace = true
description = "Remoting version of etalon-core for browser implementing WebGPU"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
publish = false

# Override the workspace's `rust-version` key. `etalon-core-remote` and its dependencies
# have a less strict MSRV, to allow firefox more leeway in updating their Rust toolchain.
#
# See the repo README for more information on MSRV policy.
rust-version = "1.87"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

[lints]
workspace = true

[features]
## Enables serialization via `serde` on common etalon types.
serde = ["dep:serde", "etalon-types/serde", "etalon-core/serde"]

[dependencies]
raw-window-handle.workspace = true
serde = { workspace = true, optional = true }
static_assertions = { workspace = true }
etalon-core = { workspace = true, default-features = false }
etalon-core-remote-types.workspace = true
etalon-hal = { workspace = true, default-features = false }
etalon-types.workspace = true
