[workspace]
resolver = "3"
members = [
    # default members
    "benches",
    "examples/features",
    "examples/standalone/*",
    "examples/bug-repro/*",
    "lock-analyzer",
    "naga-cli",
    "naga-test",
    "naga-types",
    "naga",
    "naga/fuzz",
    "naga/hlsl-snapshots",
    "naga/xtask",
    "player",
    "tests",
    "etalon-core",
    "etalon-core/platform-deps/*",
    "etalon-core-remote",
    "etalon-core-remote-types",
    "etalon-hal",
    "etalon-info",
    "etalon-naga-bridge",
    "etalon-sync",
    "etalon-types",
    "etalon",
    "xtask",
    "compat/*",
    "crates/*",
]
exclude = []
default-members = [
    "benches",
    "examples/features",
    "examples/standalone/*",
    "examples/bug-repro/*",
    "lock-analyzer",
    "naga-cli",
    "naga-test",
    "naga-types",
    "naga",
    "naga/fuzz",
    "naga/hlsl-snapshots",
    "naga/xtask",
    "player",
    "tests",
    "etalon-core",
    "etalon-core/platform-deps/*",
    "etalon-core-remote",
    "etalon-core-remote-types",
    "etalon-hal",
    "etalon-info",
    "etalon-naga-bridge",
    "etalon-sync",
    "etalon-types",
    "etalon",
    "xtask",
    "compat/*",
    "crates/*",
]

# NOTE: many packages have non-inherited [lints] sections (Cargo does not support combining
# workspace inheritance with customization) and must be updated separately.
[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
ref_as_ptr = "warn"
# NOTE: clippy configuration values (disallowed-types and
# large-error-threshold) are in other file: clippy.toml

[workspace.package]
edition = "2021"
rust-version = "1.95"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
keywords = ["graphics"]
license = "CC-BY-NC-ND-4.0"
homepage = "https://mediaprophet.github.io/etalon/"
repository = "https://github.com/mediaprophet/etalon"
version = "0.0.1"
publish = false

[workspace.dependencies]
naga = { version = "0.0.1", path = "./naga" }
naga-test = { path = "./naga-test" }
naga-types = { version = "0.0.1", path = "./naga-types" }
etalon = { version = "0.0.1", path = "./etalon", default-features = false, features = [
    "std",
    "serde",
    "wgsl",
    "vulkan",
    "gles",
    "dx12",
    "metal",
    "vulkan-portability",
    "angle",
] }
etalon-core = { version = "0.0.1", path = "./etalon-core", default-features = false }
etalon-core-remote = { version = "0.0.1", path = "./etalon-core-remote" }
etalon-core-remote-types = { version = "0.0.1", path = "./etalon-core-remote-types" }
etalon-hal = { version = "0.0.1", path = "./etalon-hal", default-features = false }
etalon-naga-bridge = { version = "0.0.1", path = "./etalon-naga-bridge" }
etalon-sync = { version = "0.0.1", path = "./etalon-sync", default-features = false }
etalon-test = { version = "0.0.1", path = "./tests" }
etalon-types = { version = "0.0.1", path = "./etalon-types", default-features = false }
etalon-agent = { version = "0.0.1", path = "./crates/etalon-agent", default-features = false }
etalon-wgsl-forge = { version = "0.0.1", path = "./crates/etalon-wgsl-forge", default-features = false }
etalon-nquin = { version = "0.0.1", path = "./crates/etalon-nquin", default-features = false }
etalon-tensor = { version = "0.0.1", path = "./crates/etalon-tensor", default-features = false }
etalon-render = { version = "0.0.1", path = "./crates/etalon-render", default-features = false }
etalon-wasm = { version = "0.0.1", path = "./crates/etalon-wasm", default-features = false }

# These _cannot_ have a version specified. If it does, crates.io will look
# for a version of the package on crates when we publish naga. Path dependencies
# are allowed through though.
hlsl-snapshots = { path = "naga/hlsl-snapshots" }

etalon-core-deps-linux-android-bsd = { version = "0.0.1", path = "./etalon-core/platform-deps/linux-android-bsd" }
etalon-core-deps-windows = { version = "0.0.1", path = "./etalon-core/platform-deps/windows" }
etalon-core-deps-apple = { version = "0.0.1", path = "./etalon-core/platform-deps/apple" }
etalon-core-deps-wasm = { version = "0.0.1", path = "./etalon-core/platform-deps/wasm" }
etalon-core-deps-emscripten = { version = "0.0.1", path = "./etalon-core/platform-deps/emscripten" }

anyhow = { version = "1.0.104", default-features = false }
approx = "0.5"
arbitrary = "1.4.2"
argh = "0.1.13"
arrayvec = { version = "0.7.8", default-features = false }
bincode = "2"
bit-set = { version = "0.11", default-features = false }
bit-vec = { version = "0.10", default-features = false }
bitflags = "2.13.2"
bytemuck = { version = "1.25.2", features = [
    "extern_crate_alloc",
    "min_const_generics",
] }
cargo_metadata = "0.23"
cfg_aliases = "0.2.2"
cfg-if = "1.0.5"
codespan-reporting = { version = "0.13", default-features = false }
diff = "0.1"
document-features = "0.2.12"
encase = "0.13"
env_logger = { version = "0.11", default-features = false, features = [
    "humantime",
] }
exhaust = "0.2"
fern = "0.7"
flume = "0.12"
futures-lite = "2"
glam = "0.34.0"
glob = "0.3"
half = { version = "2.7.1", default-features = false } # We require 2.5 to have `Arbitrary` support.
hashbrown = { version = "0.17", default-features = false, features = [
    "default-hasher",
    "inline-more",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
indexmap = { version = "2.14.2", default-features = false }
indicatif = "0.18"
itertools = { version = "0.15" }
jobserver = "0.1"
ktx2 = "0.5"
libc = { version = "0.2.191", default-features = false }
# See https://github.com/rust-fuzz/libfuzzer/issues/126
libfuzzer-sys = ">0.4.0,<=0.4.7"
libloading = "0.8"
libm = { version = "0.2.6", default-features = false }
libtest-mimic = "0.8"
# Minimum version supported by parking_lot 0.12.3
lock_api = { version = "0.4.14", default-features = false }
log = "0.4.34"
macro_rules_attribute = "0.2"
nanoserde = "0.2"
nanorand = { version = "0.8", default-features = false, features = ["wyrand"] }
noise = "0.9"
num_cpus = "1.17.0"
# `half` requires 0.2.16 for `FromBytes` and `ToBytes`.
num-traits = { version = "0.2.19", default-features = false }
nv-flip = "0.1"
obj = "0.10"
# NOTE: once_cell/std is *required* for some commonly-used features, selecting this per crate
once_cell = { version = "1.21.4", default-features = false }
# Firefox has 3.4.0 vendored, so we allow that version in our dependencies
ordered-float = { version = ">=3, <6.0", default-features = false }
parking_lot = "0.12.5"
paste = "1.0.15"
petgraph = { version = "0.8.3", default-features = false }
pico-args = { version = "0.5", features = [
    "eq-separator",
    "short-space-opt",
    "combined-flags",
] }
png = "0.18"
pollster = "1.0"
portable-atomic = "1.15.0"
portable-atomic-util = "0.2.8"
pp-rs = "0.2.1"
profiling = { version = "1.0.18", default-features = false }
# Limit to versions that use rand 0.8
proptest = ">=1, <1.7"
raw-window-handle = { version = "0.6.2", default-features = false }
rayon = "1.12.0"
regex-lite = "0.1"
renderdoc-sys = "1"
rspirv = "0.13"
ron = "0.12"
# NOTE: rustc-hash v2 is a completely different hasher with different performance characteristics
# see discussion here (including with some other alternatives): https://github.com/gfx-rs/wgpu/issues/6999
# (using default-features = false to support no-std build, avoiding any extra features that may require std::collections)
rustc-hash = { version = "1.1", default-features = false }
scopeguard = { version = "1.2", default-features = false }
serde_json = "1.0.154"
serde = { version = "1.0.229", default-features = false }
shell-words = "1"
smallvec = "1.16.3"
spirv = "0.4"
static_assertions = "1.1"
strum = { version = "0.28", default-features = false, features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.8"
trybuild = "1"
tracy-client = "0.19"
thiserror = { version = "2.0.21", default-features = false }
ureq = { version = "3.4.2", default-features = false }
unicode-ident = "1.0.27"
walkdir = "2.5.0"
winit = { version = "0.30.13", features = ["android-native-activity"] }
which = "8"
xshell = "0.2.7"

# Metal dependencies
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFCGTypes",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGColorSpace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSError",
    "NSProcessInfo",
    "NSRange",
    "NSString",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLBlitPass",
    "MTLBuffer",
    "MTLCaptureManager",
    "MTLCaptureScope",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePass",
    "MTLComputePipeline",
    "MTLCounters",
    "MTLDepthStencil",
    "MTLDevice",
    "MTLDrawable",
    "MTLEvent",
    "MTLLibrary",
    "MTLPipeline",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLSampler",
    "MTLStageInputOutputDescriptor",
    "MTLTexture",
    "MTLTypes",
    "MTLVertexDescriptor",
    "MTLAccelerationStructure",
    "MTLAccelerationStructureTypes",
    "MTLAccelerationStructureCommandEncoder",
    "MTLResidencySet",
    "MTLLogState",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CALayer",
    "CAMetalLayer",
    "objc2-metal",
] }
raw-window-metal = "1.0"

# Vulkan dependencies
android_system_properties = "0.1.1"
ash = "0.38"

# DX12 dependencies
range-alloc = "0.1"
# Requires MSVC 19.41 (Visual Studio 2022 17.11) or newer.
mach-dxcompiler-rs = { version = "=0.1.7", default-features = false, features = ["msvc_version_validation"] }
windows-core = { version = "0.62.2", default-features = false }
windows-result = { version = "0.4.1", default-features = false }

# DX12 and Vulkan dependencies
gpu-allocator = { version = "0.28", default-features = false, features = [
    "hashbrown",
] }

# Gles dependencies
khronos-egl = "6"
glow = "0.18"
glutin = { version = "0.32", default-features = false }
glutin-winit = { version = "0.5", default-features = false }
glutin_wgl_sys = "0.6"

# DX12 and GLES dependencies
windows = { version = "0.62.2", default-features = false }

# wasm dependencies
console_error_panic_hook = "0.1.7"
console_log = "1"
js-sys = { version = "0.3.106", default-features = false }
wasm-bindgen = { version = "0.2.129", default-features = false }
wasm-bindgen-futures = { version = "0.4.79", default-features = false }
web-sys = { version = "0.3.106", default-features = false }
web-time = "1.1.0"

tokio = "1.54.1"
termcolor = "1.4.1"

# android dependencies
ndk-sys = "0.6"

# These overrides allow our examples to explicitly depend on release crates
[patch.crates-io]
etalon = { path = "./etalon" }

[profile.release]
lto = "thin"
debug = true

# Speed up image comparison even in debug builds
[profile.dev.package."nv-flip-sys"]
opt-level = 3
