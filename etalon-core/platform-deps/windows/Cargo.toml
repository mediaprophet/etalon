[package]
name = "etalon-core-deps-windows"
version.workspace = true
edition.workspace = true
description = "Feature unification helper crate for the Windows/Linux/Android platforms"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"

# Override the workspace's `rust-version` key. Firefox uses `cargo vendor` to
# copy the crates it actually uses out of the workspace, so it's meaningful for
# them to have less restrictive MSRVs individually than the workspace as a
# whole, if their code permits. See `../README.md` for details.
rust-version = "1.87"

[features]
gles = ["etalon-hal/gles"]
vulkan = ["etalon-hal/vulkan"]
dx12 = ["etalon-hal/dx12"]
renderdoc = ["etalon-hal/renderdoc"]

## Support creating textures from DRM display/window handles.
drm = ["etalon-hal/drm"]

# Depend on etalon-hal conditionally, so that the above features only apply to etalon-hal on this set of platforms.
[target.'cfg(windows)'.dependencies]
etalon-hal = { workspace = true, default-features = true }

[lints]
workspace = true
