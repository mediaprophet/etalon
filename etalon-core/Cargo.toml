[package]
name = "etalon-core"
version.workspace = true
edition.workspace = true
description = "Core implementation logic of etalon, the cross-platform, safe, pure-rust graphics API"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
publish = false

# Override the workspace's `rust-version` key. `etalon-core` and its dependencies
# have a less strict MSRV, to allow firefox more leeway in updating their Rust toolchain.
#
# See the repo README for more information on MSRV policy.
rust-version = "1.87"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

[package.metadata.cargo-machete]
# Cargo machete can't check build.rs dependencies. See https://github.com/bnjbvr/cargo-machete/issues/100
ignored = ["cfg_aliases"]

[lints.rust]
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(etalon_validate_locks)',
    'cfg(etalon_validate_locks_debug)',
] }

[lib]

[features]
#! See documentation for the `etalon` crate for more in-depth information on these features.

# TODO(https://github.com/mediaprophet/etalon/issues/6826): "std" is a default feature for
# compatibility with prior behavior only, and should be removed once we know how
# etalon-core’s dependents want to handle no_std.
default = ["std"]

#! ### Logging Configuration
# --------------------------------------------------------------------

## Log all API entry points at info instead of trace level.
## Also, promotes certain debug log calls to info.
api_log_info = []

## Log resource lifecycle management at info instead of trace level.
resource_log_info = []

#! ### Runtime Checks
# --------------------------------------------------------------------

## Apply run-time checks, even in release builds. These are in addition
## to the validation carried out at public APIs in all builds.
strict_asserts = ["etalon-types/strict_asserts"]

#! ### Debugging
# --------------------------------------------------------------------

## Enable lock order observation.
observe_locks = ["std", "dep:ron", "serde/serde_derive"]

#! ### Serialization
# --------------------------------------------------------------------

## Enables serialization via `serde` on common etalon types.
serde = [
    "dep:serde",
    "etalon-types/serde",
    "arrayvec/serde",
    "hashbrown/serde",
    "smallvec/serde",
    "macro_rules_attribute",
]

## Enable API tracing.
trace = ["serde", "std", "dep:ron", "naga/serialize", "etalon-types/trace"]

## Enable API replaying
replay = ["serde", "naga/deserialize", "std"]

#! ### Shading Language Support
# --------------------------------------------------------------------

## Enable `ShaderModuleSource::Wgsl`
wgsl = ["naga/wgsl-in"]

## Enable `ShaderModuleSource::Glsl`
glsl = ["naga/glsl-in"]

## Enable `ShaderModuleSource::SpirV`
spirv = ["naga/spv-in"]

#! ### Other
# --------------------------------------------------------------------

## Internally count resources and events for debugging purposes. If the counters
## feature is disabled, the counting infrastructure is removed from the build and
## the exposed counters always return 0.
counters = ["etalon-types/counters"]

## Implement `Send` and `Sync` on Wasm, but only if atomics are not enabled.
fragile-send-sync-non-atomic-wasm = [
    "etalon-hal/fragile-send-sync-non-atomic-wasm",
]

## Enable certain items to be `Send` and `Sync` when they would not otherwise be.
## Also enables backtraces in some error cases when also under cfg(debug_assertions).
std = ["etalon-sync/std"]

#! ### External libraries
# --------------------------------------------------------------------
#! The following features facilitate integration with third-party supporting libraries.

## Enable using the `mach-dxcompiler-rs` crate to compile DX12 shaders.
static-dxc = ["etalon-hal/static-dxc"]

## Enable portable atomics on platforms that do not support 64bit atomics.
portable-atomic = ["etalon-sync/portable-atomic", "etalon-hal/portable-atomic"]

#! ### Target Conditional Features
# --------------------------------------------------------------------
# Look to etalon-hal's Cargo.toml for explaination how these features and the etalon-core
# platform crates collude to provide platform-specific behavior.

## DX12 backend
dx12 = ["etalon-core-deps-windows/dx12"]
## Metal backend
metal = ["etalon-core-deps-apple/metal"]
## Vulkan backend, only available on Windows, Linux, Android
vulkan = [
    "etalon-core-deps-linux-android-bsd/vulkan",
    "etalon-core-deps-windows/vulkan",
]
## OpenGL backend, only available on Windows, Linux, Android, and Emscripten
gles = [
    "etalon-core-deps-linux-android-bsd/gles",
    "etalon-core-deps-windows/gles",
    "etalon-core-deps-emscripten/gles",
]

## WebGL backend, only available on Emscripten
webgl = ["etalon-core-deps-wasm/webgl", "etalon-types/web"]
## OpenGL backend via ANGLE, only available on macOS
angle = ["etalon-core-deps-apple/angle"]
## Vulkan portability backend, only available on macOS
vulkan-portability = ["etalon-core-deps-apple/vulkan-portability"]
## Renderdoc integration, only available on Windows, Linux, and Android
renderdoc = [
    "etalon-core-deps-linux-android-bsd/renderdoc",
    "etalon-core-deps-windows/renderdoc",
]

## Support creating textures from DRM display/window handles.
drm = ["etalon-core-deps-windows/drm", "etalon-core-deps-linux-android-bsd/drm"]

## Enable the `noop` backend.
noop = []

# The target limitation here isn't needed, but prevents more than one of these
# platform crates from being included in the build at a time, preventing users
# from getting confused by seeing them in the list of crates.
[target.'cfg(target_vendor = "apple")'.dependencies]
etalon-core-deps-apple = { workspace = true, optional = true }

[target.'cfg(target_os = "emscripten")'.dependencies]
etalon-core-deps-emscripten = { workspace = true, optional = true }

[target.'cfg(all(target_family = "wasm", not(target_os = "emscripten")))'.dependencies]
etalon-core-deps-wasm = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
etalon-core-deps-linux-android-bsd = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
etalon-core-deps-windows = { workspace = true, optional = true }

[dependencies]
naga.workspace = true
naga-types.workspace = true
etalon-naga-bridge.workspace = true
etalon-hal = { workspace = true, default-features = true }
etalon-sync = { workspace = true, default-features = false }
etalon-types.workspace = true

arrayvec.workspace = true
bit-vec.workspace = true
bit-set.workspace = true
bitflags.workspace = true
bytemuck.workspace = true
document-features.workspace = true
hashbrown.workspace = true
indexmap.workspace = true
log.workspace = true
macro_rules_attribute = { workspace = true, optional = true }
num-traits = { workspace = true }
profiling = { workspace = true, default-features = false }
raw-window-handle.workspace = true
ron = { workspace = true, optional = true }
rustc-hash.workspace = true
scopeguard.workspace = true
serde = { workspace = true, features = ["derive"], default-features = false, optional = true }
smallvec.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest.workspace = true

[build-dependencies]
cfg_aliases.workspace = true
